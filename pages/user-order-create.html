<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>确认下单 - 满改平台</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      .provider-select-page { position: absolute; inset: 0; background: linear-gradient(180deg, #14181f 0%, #0e131a 100%); z-index: 50; display: flex; flex-direction: column; }
      .provider-select-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .provider-select-header h3 { font-size: 18px; margin: 0; }
      .provider-select-back { background: transparent; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 6px 0; }
      .provider-select-list { flex: 1; overflow-y: auto; padding: 12px 16px 100px; }
      .provider-card { display: grid; grid-template-columns: 80px 1fr; gap: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px; margin-bottom: 12px; cursor: pointer; transition: background 0.2s; color: #fff; text-align: left; }
      .provider-card:hover, .provider-card:active { background: rgba(255,255,255,0.12); }
      .provider-card-photo { width: 80px; height: 80px; border-radius: 12px; background: linear-gradient(135deg, rgba(255,106,0,0.25), rgba(255,140,50,0.15)); display: flex; align-items: center; justify-content: center; font-size: 28px; }
      .provider-card-body { display: flex; flex-direction: column; gap: 6px; }
      .provider-card-name { font-size: 15px; font-weight: 600; color: #fff; }
      .provider-card-meta { display: flex; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.65); }
      .provider-card-score { color: #f5a623; }
      .order-variant-panel { margin-top: 12px; padding: 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(255,255,255,0.04); }
      .order-variant-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .order-variant-head strong { color: #fff; font-size: 15px; }
      .order-variant-head span { color: var(--muted); font-size: 12px; text-align: right; }
      .order-variant-group { display: grid; gap: 8px; margin-bottom: 12px; }
      .order-variant-group:last-child { margin-bottom: 0; }
      .order-variant-label { color: var(--muted); font-size: 13px; }
      .order-variant-options { display: flex; flex-wrap: wrap; gap: 8px; }
      .order-variant-option { min-width: 64px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.88); font-size: 12px; cursor: pointer; }
      .order-variant-option.active { border-color: #ff6a00; background: rgba(255,106,0,0.16); color: #ff6a00; }
      .order-variant-option.disabled { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }
      .order-variant-summary { color: var(--muted); font-size: 12px; line-height: 1.5; }
      .order-custom-confirm { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(2, 5, 10, 0.72); backdrop-filter: blur(10px); }
      .order-custom-confirm[hidden] { display: none; }
      .order-custom-card { width: 100%; max-width: 320px; border: 1px solid rgba(255, 106, 0, 0.35); border-radius: 18px; padding: 18px; background: linear-gradient(180deg, rgba(30,34,40,0.98), rgba(14,18,25,0.98)); box-shadow: 0 22px 60px rgba(0,0,0,0.46); }
      .order-custom-card h3 { margin: 0 0 10px; font-size: 18px; color: #fff; }
      .order-custom-card p { margin: 0; color: rgba(255,255,255,0.82); font-size: 14px; line-height: 1.7; }
      .order-custom-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
      .order-custom-actions .btn { min-height: 42px; }
    </style>
  </head>
  <body data-page="user-order-create">
    <main class="page-shell phone-stage">
      <div class="phone-wrap">
        <div class="phone-frame">
          <div class="phone-screen" data-mobile-shell="user">
            <div class="android-status"><span>9:41</span><span>5G 92%</span></div>
            <header class="android-topbar product-detail-topbar">
              <h2>确认下单</h2>
            </header>
            <section class="screen-content">
              <div class="stack order-create-page">
                <section class="order-create-product">
                  <div class="order-create-visual">
                    <span class="product-detail-sku" id="orderSku">SKU</span>
                  </div>
                  <div class="product-detail-head">
                      <h3 id="orderName">改装商品</h3>
                      <p id="orderFitment">适配车型信息</p>
                      <p id="orderVariant" style="display:none; color:var(--accent); font-size:12px;"></p>
                      <div class="product-detail-price-line">
                      <strong id="orderPrice">¥0</strong>
                      <span id="orderBrand">-</span>
                    </div>
                  </div>
                </section>

                <section class="order-variant-panel" id="orderVariantPanel" hidden>
                  <div class="order-variant-head">
                    <strong>选择规格</strong>
                    <span>下单前确认尺寸、颜色、材质</span>
                  </div>
                  <div id="orderVariantPicker"></div>
                  <div class="order-variant-summary" id="orderVariantSummary"></div>
                </section>

                <section class="order-create-summary">
                  <div class="product-detail-section-head">
                    <h3>订单信息</h3>
                  </div>
                  <div class="product-detail-kv-grid">
                    <article>
                      <span>商品数量</span>
                      <strong id="orderQuantityText">1 件</strong>
                    </article>
                    <article>
                      <span>商品金额</span>
                      <strong id="orderGoodsPrice">¥0</strong>
                    </article>
                    <article>
                      <span>改装服务费</span>
                      <strong id="orderServiceFee">待门店确认</strong>
                    </article>
                    <article class="order-coupon-row">
                      <span>优惠券</span>
                      <button type="button" class="order-coupon-picker" id="orderCouponPicker">选择优惠券 ›</button>
                      <strong id="orderCouponDiscount" style="display:none; color:var(--accent);">-¥0</strong>
                    </article>
                    <article>
                      <span>合计金额</span>
                      <strong id="orderTotalPrice">¥0</strong>
                    </article>
                  </div>
                  <div class="order-price-note" id="orderPriceNote" style="display:none; margin-top:10px; font-size:12px; color:var(--muted);">* 以上价格不含改装施工费用，施工费由门店根据实际情况报价。</div>
                  <div class="order-coupon-panel" id="orderCouponPanel" style="display:none;">
                    <div class="order-coupon-list" id="orderCouponList"></div>
                  </div>
                </section>

                <form class="order-create-form" id="orderCreateForm">
                  <div class="field-group field-group-full">
                    <label class="field-label">配送方式</label>
                    <div class="order-delivery-options">
                      <label class="order-delivery-option active">
                        <input type="radio" name="deliveryType" value="self" checked />
                        <span class="order-delivery-title">平台自提</span>
                        <span class="order-delivery-desc">快递发货，自行取货</span>
                      </label>
                      <label class="order-delivery-option">
                        <input type="radio" name="deliveryType" value="provider" />
                        <span class="order-delivery-title">指定服务商</span>
                        <span class="order-delivery-desc">寄到门店，到货后预约</span>
                      </label>
                    </div>
                  </div>
                  <div class="field-group field-group-full" id="providerSelectGroup" style="display:none;">
                    <label class="field-label">意向服务商</label>
                    <button type="button" class="input provider-picker-trigger" id="providerPickerTrigger" style="text-align:left; background:transparent; cursor:pointer;">选择服务商（可选）</button>
                    <input type="hidden" id="orderProvider" name="orderProvider" value="" />
                  </div>
                  <div class="field-group field-group-full" id="appointmentGroup" style="display:none;">
                    <label class="field-label" for="orderAppointment">预约安装时间</label>
                    <input class="input" id="orderAppointment" name="orderAppointment" type="datetime-local" value="" />
                  </div>
                  <div class="field-group field-group-full">
                    <label class="field-label">支付方式</label>
                    <div class="order-pay-options">
                      <label class="order-pay-option active">
                        <input type="radio" name="paymentMethod" value="alipay" checked />
                        <span class="order-pay-title">支付宝</span>
                      </label>
                      <label class="order-pay-option">
                        <input type="radio" name="paymentMethod" value="wechat" />
                        <span class="order-pay-title">微信支付</span>
                      </label>
                    </div>
                  </div>
                  <div class="field-group">
                    <label class="field-label" for="orderVehicle">车辆信息</label>
                    <input class="input" id="orderVehicle" name="orderVehicle" type="text" value="宝马 G20 330i" required />
                  </div>
                  <div class="field-group">
                    <label class="field-label" for="orderRecipientInput">收货人</label>
                    <input class="input" id="orderRecipientInput" name="orderRecipient" type="text" value="周恺" required />
                  </div>
                  <div class="field-group">
                    <label class="field-label" for="orderPhone">联系电话</label>
                    <input class="input" id="orderPhone" name="orderPhone" type="text" value="13800138000" required />
                  </div>
                  <div class="field-group field-group-full">
                    <label class="field-label" for="orderAddress">收货地址</label>
                    <textarea class="textarea" id="orderAddress" name="orderAddress" required>上海市闵行区申长路 1688 号 2 栋 801</textarea>
                  </div>
                  <div class="field-group">
                    <label class="field-label" for="orderQuantity">购买数量</label>
                    <input class="input" id="orderQuantity" name="orderQuantity" type="number" min="1" max="9" value="1" required />
                  </div>
                  <div class="field-group field-group-full">
                    <label class="field-label" for="orderNote">备注</label>
                    <textarea class="textarea" id="orderNote" name="orderNote" required>发货后请按物流信息签收快递。</textarea>
                  </div>
                  <div class="order-create-bottom-summary" aria-live="polite">
                    <div><span>优惠</span><strong id="orderBottomDiscount">-¥ 0</strong></div>
                    <div><span>应付金额</span><strong id="orderBottomTotal">¥ 0</strong></div>
                  </div>
                  <div class="order-create-actions">
                    <a class="btn btn-secondary" id="orderBackLink" href="user-app.html">返回商城</a>
                    <button class="btn btn-primary" type="submit">提交订单</button>
                  </div>
                </form>

                <section class="order-create-success" id="orderSuccess" hidden>
                  <div class="order-payment-countdown" id="orderPaymentCountdown" role="status" aria-live="polite">
                    <span>请在 15 分钟内完成付款</span>
                    <strong id="orderPaymentCountdownValue">15:00</strong>
                  </div>
                  <h3 id="orderSuccessTitle">订单已提交</h3>
                  <p id="orderSuccessText">订单已提交，请在倒计时结束前完成支付。</p>
                  <div class="order-create-actions">
                    <a class="btn btn-secondary" id="orderContinueLink" href="user-app.html">继续逛商城</a>
                    <a class="btn btn-primary" id="orderCenterLink" href="#">去支付</a>
                  </div>
                </section>

                <section class="order-payment-panel" id="orderPaymentPanel" hidden>
                  <div class="product-detail-section-head">
                    <h3>订单支付</h3>
                    <span>Mock 支付</span>
                  </div>
                  <div class="order-payment-summary">
                    <div><span>支付金额</span><strong id="orderPaymentAmount">¥ 0</strong></div>
                    <div><span>支付方式</span><strong id="orderPaymentMethod">支付宝</strong></div>
                  </div>
                  <button class="btn btn-primary order-payment-confirm" id="orderPaymentConfirm" type="button">确认支付</button>
                </section>
              </div>

              <!-- 服务商选择页面 -->
              <section class="provider-select-page" id="providerSelectPage" style="display:none;">
                <header class="provider-select-header">
                  <button type="button" class="provider-select-back" id="providerSelectBack">‹ 返回</button>
                  <h3>选择服务商</h3>
                </header>
                <div class="provider-select-list" id="providerSelectList"></div>
              </section>
              <section class="order-custom-confirm" id="orderCustomConfirm" role="dialog" aria-modal="true" aria-labelledby="orderCustomConfirmTitle" hidden>
                <div class="order-custom-card">
                  <h3 id="orderCustomConfirmTitle">定制商品提示</h3>
                  <p>定制商品寄出后非质量原因无法退款！</p>
                  <div class="order-custom-actions">
                    <button class="btn btn-secondary" type="button" id="orderCustomConfirmCancel">取消</button>
                    <button class="btn btn-primary" type="button" id="orderCustomConfirmOk">已知晓</button>
                  </div>
                </div>
              </section>
            </section>
            <nav class="bottom-nav">
              <button type="button" data-user-nav="forum"><span>社区</span></button>
              <button class="active" type="button" data-user-nav="mall"><span>商城</span></button>
              <button type="button" data-user-nav="garage"><span>爱车</span></button>
              <button type="button" data-user-nav="messages"><span>消息</span></button>
              <button type="button" data-user-nav="me"><span>我的</span></button>
            </nav>
          </div>
        </div>
      </div>
    </main>
    <script src="../assets/js/mock-data.js"></script>
    <script>
      const ORDER_STORAGE_KEY = "mockUserOrders";
      const CART_STORAGE_KEY = "mockUserCart";
      const params = new URLSearchParams(location.search);
      const sku = params.get("sku") || "SKU";
      const variantSkuParam = params.get("variantSku") || "";
      const specSummaryParam = params.get("specSummary") || "";
      const name = params.get("name") || "改装商品";
      const price = params.get("price") || "¥0";
      const brand = params.get("brand") || "-";
      const fitment = params.get("fitment") || "适配车型信息";
      const mallPage = params.get("mallPage") || "exterior";
      const sourceFrom = params.get("from") || "";
      const initialQuantity = Math.max(1, Number(params.get("quantity") || 1));
      const allProducts = window.MockData?.products || [];
      const matchedProduct = allProducts.find((item) => item.sku === sku || item.variants?.some((variant) => variant.sku === variantSkuParam)) || {};
      const product = matchedProduct;
      const baseSku = product.sku || sku;
      const variants = Array.isArray(product.variants) ? product.variants : [];
      const specs = Array.isArray(product.specs) ? product.specs.filter((spec) => spec?.name && Array.isArray(spec.options) && spec.options.length) : [];
      const isCustomProduct = product.isCustomProduct === true || ["是", "true", "1"].includes(String(product.isCustomProduct || product.customProduct || "").trim().toLowerCase());
      const selectedValues = {};
      let currentVariant = variants.find((variant) => variant.sku === variantSkuParam) || null;
      let currentVariantSku = currentVariant?.sku || variantSkuParam || "";
      let currentSpecSummary = specSummaryParam || "";
      let currentOrderPrice = currentVariant?.price || product.price || price;

      const orderSkuEl = document.getElementById("orderSku");
      const orderNameEl = document.getElementById("orderName");
      const orderFitmentEl = document.getElementById("orderFitment");
      const orderVariantEl = document.getElementById("orderVariant");
      const orderVariantPanel = document.getElementById("orderVariantPanel");
      const orderVariantPicker = document.getElementById("orderVariantPicker");
      const orderVariantSummary = document.getElementById("orderVariantSummary");
      const orderBrandEl = document.getElementById("orderBrand");
      const orderPriceEl = document.getElementById("orderPrice");
      const orderQuantityTextEl = document.getElementById("orderQuantityText");
      const orderTotalPriceEl = document.getElementById("orderTotalPrice");
      const orderGoodsPriceEl = document.getElementById("orderGoodsPrice");
      const orderServiceFeeEl = document.getElementById("orderServiceFee");
      const orderCouponPicker = document.getElementById("orderCouponPicker");
      const orderCouponDiscount = document.getElementById("orderCouponDiscount");
      const orderCouponPanel = document.getElementById("orderCouponPanel");
      const orderCouponList = document.getElementById("orderCouponList");
      const orderRecipientInput = document.getElementById("orderRecipientInput");
      const orderQuantityInput = document.getElementById("orderQuantity");
      const orderAddressInput = document.getElementById("orderAddress");
      const orderBottomDiscount = document.getElementById("orderBottomDiscount");
      const orderBottomTotal = document.getElementById("orderBottomTotal");
      const orderCreateForm = document.getElementById("orderCreateForm");
      const orderSuccess = document.getElementById("orderSuccess");
      const orderSuccessTitle = document.getElementById("orderSuccessTitle");
      const orderSuccessText = document.getElementById("orderSuccessText");
      const orderPaymentCountdown = document.getElementById("orderPaymentCountdown");
      const orderPaymentCountdownValue = document.getElementById("orderPaymentCountdownValue");
      const orderPaymentPanel = document.getElementById("orderPaymentPanel");
      const orderPaymentAmount = document.getElementById("orderPaymentAmount");
      const orderPaymentMethod = document.getElementById("orderPaymentMethod");
      const orderPaymentConfirm = document.getElementById("orderPaymentConfirm");
      const orderBackLink = document.getElementById("orderBackLink");
      const orderContinueLink = document.getElementById("orderContinueLink");
      const orderCenterLink = document.getElementById("orderCenterLink");
      const orderCustomConfirm = document.getElementById("orderCustomConfirm");
      const orderCustomConfirmOk = document.getElementById("orderCustomConfirmOk");
      const orderCustomConfirmCancel = document.getElementById("orderCustomConfirmCancel");
      let currentOrderId = "";
      let currentPaymentDeadline = 0;
      let currentPaymentSourceName = "";
      let currentPaymentPoints = 0;
      let paymentCompleted = false;
      let customProductNoticeAccepted = false;

      if (currentVariant?.values) Object.assign(selectedValues, currentVariant.values);
      function optionAvailable(specName, option) {
        return variants.some((variant) => variant.status !== "下架" && Number(variant.stock || 0) > 0 && variant.values?.[specName] === option);
      }
      function findVariant(values) {
        return variants.find((variant) => specs.every((spec) => variant.values?.[spec.name] === values[spec.name])) || null;
      }
      function buildSpecSummary() {
        return specs.map((spec) => `${spec.name}：${selectedValues[spec.name] || ""}`).join(" / ");
      }
      function renderOrderVariantPicker() {
        if (!orderVariantPanel || !orderVariantPicker || !variants.length || !specs.length) return;
        orderVariantPanel.hidden = false;
        orderVariantPicker.innerHTML = specs.map((spec) => `<div class="order-variant-group"><span class="order-variant-label">${spec.name}</span><div class="order-variant-options">${spec.options.map((option) => {
          const active = selectedValues[spec.name] === option;
          const disabled = !optionAvailable(spec.name, option);
          return `<button class="order-variant-option ${active ? "active" : ""} ${disabled ? "disabled" : ""}" type="button" data-order-variant-spec="${spec.name}" data-order-variant-option="${option}" ${disabled ? "disabled" : ""}>${option}</button>`;
        }).join("")}</div></div>`).join("");
        orderVariantSummary.textContent = currentVariant ? `已选：${currentSpecSummary} · ${currentVariantSku}` : "请选择完整且有库存的规格";
      }
      function syncOrderVariant() {
        if (variants.length && specs.length) {
          currentVariant = findVariant(selectedValues);
          if (currentVariant) {
            currentVariantSku = currentVariant.sku || "";
            currentSpecSummary = buildSpecSummary();
            currentOrderPrice = currentVariant.price || product.price || price;
          } else {
            currentVariantSku = "";
            currentSpecSummary = "";
            currentOrderPrice = product.price || price;
          }
        }
        orderSkuEl.textContent = currentVariantSku || baseSku;
        orderNameEl.textContent = product.name || name;
        orderFitmentEl.textContent = product.fitment || fitment;
        orderBrandEl.textContent = product.brand || brand;
        orderPriceEl.textContent = currentOrderPrice;
        if (currentSpecSummary) {
          orderVariantEl.textContent = `已选规格：${currentSpecSummary}`;
          orderVariantEl.style.display = "block";
        } else {
          orderVariantEl.textContent = "";
          orderVariantEl.style.display = "none";
        }
        renderOrderVariantPicker();
        syncSummary();
      }
      if (variants.length && specs.length) {
        specs.forEach((spec) => {
          if (!selectedValues[spec.name]) selectedValues[spec.name] = spec.options.find((option) => optionAvailable(spec.name, option)) || spec.options[0];
        });
        currentVariant = findVariant(selectedValues) || variants.find((variant) => variant.status !== "下架" && Number(variant.stock || 0) > 0) || variants[0] || null;
        if (currentVariant?.values) Object.assign(selectedValues, currentVariant.values);
        orderVariantPicker.addEventListener("click", (event) => {
          const button = event.target.closest("[data-order-variant-spec]");
          if (!button) return;
          selectedValues[button.dataset.orderVariantSpec] = button.dataset.orderVariantOption;
          if (!findVariant(selectedValues)) {
            const fallback = variants.find((variant) => variant.status !== "下架" && Number(variant.stock || 0) > 0 && variant.values?.[button.dataset.orderVariantSpec] === button.dataset.orderVariantOption);
            if (fallback?.values) Object.assign(selectedValues, fallback.values);
          }
          syncOrderVariant();
        });
      }
      orderQuantityInput.value = String(initialQuantity);

      const returnTab = mallPage === "garage" ? "garage" : "mall";
      orderBackLink.href = returnTab === "garage" ? "user-app.html?tab=garage" : `user-app.html?tab=mall&mallPage=${encodeURIComponent(mallPage)}`;
      orderContinueLink.href = orderBackLink.href;
      document.querySelectorAll("[data-user-nav]").forEach((button) => {
        button.classList.toggle("active", button.dataset.userNav === returnTab);
      });

      document.querySelectorAll("[data-user-nav]").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.userNav || "home";
          const suffix = target === "mall" ? `?tab=mall&mallPage=${encodeURIComponent(mallPage)}` : `?tab=${encodeURIComponent(target)}`;
          window.location.href = `user-app.html${suffix}`;
        });
      });

      function priceToNumber(value) {
        return Number(String(value || "").replace(/[^\d.]/g, "")) || 0;
      }

      function formatCurrency(value) {
        return `¥ ${Number(value || 0).toLocaleString("zh-CN")}`;
      }

      function readOrders() {
        try {
          const raw = window.localStorage.getItem(ORDER_STORAGE_KEY);
          const rows = JSON.parse(raw || "[]");
          return Array.isArray(rows) ? rows : [];
        } catch (error) {
          return [];
        }
      }

      function writeOrders(rows) {
        window.localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(rows));
      }

      function updateStoredOrder(orderId, updates) {
        if (!orderId) return;
        const rows = readOrders();
        const index = rows.findIndex((item) => item.id === orderId);
        if (index < 0) return;
        rows[index] = { ...rows[index], ...updates };
        writeOrders(rows);
      }

      const PAYMENT_COUNTDOWN_MS = 15 * 60 * 1000;
      let paymentCountdownTimer = null;

      function formatPaymentCountdown(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function startPaymentCountdown(deadline, orderId) {
        if (!orderPaymentCountdownValue) return;
        if (paymentCountdownTimer) window.clearInterval(paymentCountdownTimer);
        currentPaymentDeadline = Number(deadline) || 0;
        const updateCountdown = () => {
          const remainingSeconds = Math.max(0, Math.ceil((Number(deadline) - Date.now()) / 1000));
          orderPaymentCountdownValue.textContent = formatPaymentCountdown(remainingSeconds);
          if (remainingSeconds <= 0 && !paymentCompleted) {
            window.clearInterval(paymentCountdownTimer);
            paymentCountdownTimer = null;
            orderPaymentCountdown?.classList.add("expired");
            if (orderPaymentCountdown) orderPaymentCountdown.querySelector("span").textContent = "付款时间已结束，请重新下单";
            if (orderPaymentConfirm) orderPaymentConfirm.disabled = true;
            updateStoredOrder(orderId, {
              payment: "已关闭",
              status: "已关闭",
              progress: "超过 15 分钟未完成付款，订单已关闭。",
            });
          }
        };
        orderPaymentCountdown.classList.remove("expired");
        orderPaymentCountdown.classList.remove("paid");
        orderPaymentCountdown.querySelector("span").textContent = "请在 15 分钟内完成付款";
        if (orderPaymentConfirm) orderPaymentConfirm.disabled = false;
        updateCountdown();
        paymentCountdownTimer = window.setInterval(updateCountdown, 1000);
      }

      function readCart() {
        try {
          const raw = window.localStorage.getItem(CART_STORAGE_KEY);
          const rows = JSON.parse(raw || "[]");
          return Array.isArray(rows) ? rows : [];
        } catch (error) {
          return [];
        }
      }

      function writeCart(rows) {
        window.localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(rows));
      }

      const POINTS_STORAGE_KEY = "mockUserPoints";
      function pad2(value) {
        return String(value).padStart(2, "0");
      }
      function getNowStamp() {
        const date = new Date();
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
      }
      function readPoints() {
        try {
          const raw = window.localStorage.getItem(POINTS_STORAGE_KEY);
          const rows = JSON.parse(raw || "[]");
          return Array.isArray(rows) ? rows : [];
        } catch (error) {
          return [];
        }
      }
      function writePoints(rows) {
        window.localStorage.setItem(POINTS_STORAGE_KEY, JSON.stringify(rows));
      }
      function appendPointRow(row) {
        const rows = readPoints();
        if (row.sourceId && rows.some((item) => item.type === row.type && item.sourceId === row.sourceId)) return null;
        const nextRow = {
          id: row.id || `PT-${Date.now().toString().slice(-6)}`,
          type: row.type || "manual",
          title: row.title || "积分获得",
          points: Number(row.points || 0),
          source: row.source || "用户端",
          sourceId: row.sourceId || "",
          time: row.time || getNowStamp(),
          desc: row.desc || "",
        };
        writePoints([nextRow, ...rows].slice(0, 80));
        return nextRow;
      }

      const availableCoupons = [
        { id: "C001", name: "新用户专享券", type: "fixed", value: 200, threshold: 2000, desc: "满¥2,000减¥200" },
        { id: "C002", name: "618改装节", type: "percent", value: 0.9, threshold: 5000, desc: "满¥5,000享9折" },
        { id: "C003", name: "满减券", type: "fixed", value: 300, threshold: 1500, desc: "满¥1,500减¥300" },
      ];
      let selectedCoupon = null;

      function calcDiscount(goodsTotal) {
        if (!selectedCoupon) return 0;
        if (goodsTotal < selectedCoupon.threshold) return 0;
        if (selectedCoupon.type === "percent") return Math.floor(goodsTotal * (1 - selectedCoupon.value));
        return selectedCoupon.value;
      }

      function renderCouponList() {
        const goodsTotal = priceToNumber(currentOrderPrice) * Math.max(1, Number(orderQuantityInput.value || 1));
        orderCouponList.innerHTML = `<div class="order-coupon-item" data-coupon=""><span>不使用优惠券</span></div>` +
          availableCoupons.map((c) => {
            const usable = goodsTotal >= c.threshold;
            return `<div class="order-coupon-item ${usable ? "" : "disabled"} ${selectedCoupon?.id === c.id ? "active" : ""}" data-coupon="${c.id}"><div><strong>${c.name}</strong><span>${c.desc}</span></div>${selectedCoupon?.id === c.id ? "<b>✓</b>" : ""}</div>`;
          }).join("");
        orderCouponList.querySelectorAll("[data-coupon]").forEach((el) => {
          el.addEventListener("click", () => {
            const cid = el.dataset.coupon;
            selectedCoupon = cid ? availableCoupons.find((c) => c.id === cid) : null;
            renderCouponList();
            syncSummary();
          });
        });
      }

      orderCouponPicker.addEventListener("click", () => {
        const isHidden = orderCouponPanel.style.display === "none";
        orderCouponPanel.style.display = isHidden ? "block" : "none";
        if (isHidden) renderCouponList();
      });

      function syncSummary() {
        const quantity = Math.max(1, Number(orderQuantityInput.value || 1));
        const goodsTotal = priceToNumber(currentOrderPrice) * quantity;
        const discount = calcDiscount(goodsTotal);
        const finalTotal = Math.max(0, goodsTotal - discount);
        orderQuantityTextEl.textContent = `${quantity} 件`;
        orderGoodsPriceEl.textContent = formatCurrency(goodsTotal);
        if (discount > 0) {
          orderCouponPicker.style.display = "none";
          orderCouponDiscount.style.display = "inline";
          orderCouponDiscount.textContent = `-¥${discount}`;
          orderCouponPicker.textContent = selectedCoupon ? `${selectedCoupon.name} ›` : "选择优惠券 ›";
        } else {
          orderCouponPicker.style.display = "inline";
          orderCouponDiscount.style.display = "none";
          orderCouponPicker.textContent = selectedCoupon ? `${selectedCoupon.name} ›` : "选择优惠券 ›";
        }
        orderTotalPriceEl.textContent = formatCurrency(finalTotal);
        orderBottomDiscount.textContent = `-¥ ${discount.toLocaleString("zh-CN")}`;
        orderBottomTotal.textContent = formatCurrency(finalTotal);
      }

      orderQuantityInput.addEventListener("input", syncSummary);
      orderAddressInput.addEventListener("input", syncSummary);
      syncOrderVariant();

      // Delivery type toggle
      document.querySelectorAll('input[name="deliveryType"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          const providerGroup = document.getElementById("providerSelectGroup");
          const appointmentGroup = document.getElementById("appointmentGroup");
          const priceNote = document.getElementById("orderPriceNote");
          document.querySelectorAll(".order-delivery-option").forEach((label) => label.classList.remove("active"));
          radio.closest(".order-delivery-option").classList.add("active");
          const isProvider = radio.value === "provider";
          providerGroup.style.display = isProvider ? "block" : "none";
          appointmentGroup.style.display = "none";
          if (priceNote) priceNote.style.display = isProvider ? "block" : "none";
        });
      });

      // Payment method toggle
      document.querySelectorAll('input[name="paymentMethod"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          document.querySelectorAll(".order-pay-option").forEach((label) => label.classList.remove("active"));
          radio.closest(".order-pay-option").classList.add("active");
        });
      });

      function showCustomProductConfirm() {
        if (!orderCustomConfirm) return;
        orderCustomConfirm.hidden = false;
        if (screenContent) screenContent.style.overflow = "hidden";
      }

      function hideCustomProductConfirm() {
        if (!orderCustomConfirm) return;
        orderCustomConfirm.hidden = true;
        if (screenContent) screenContent.style.overflow = "";
      }

      orderCustomConfirmCancel?.addEventListener("click", () => {
        customProductNoticeAccepted = false;
        hideCustomProductConfirm();
      });

      orderCustomConfirmOk?.addEventListener("click", () => {
        customProductNoticeAccepted = true;
        hideCustomProductConfirm();
        if (typeof orderCreateForm.requestSubmit === "function") {
          orderCreateForm.requestSubmit();
        } else {
          orderCreateForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
        }
      });

      orderCreateForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(orderCreateForm);
        const vehicle = String(formData.get("orderVehicle") || "").trim();
        const recipient = String(formData.get("orderRecipient") || "").trim();
        const phone = String(formData.get("orderPhone") || "").trim();
        const address = String(formData.get("orderAddress") || "").trim();
        const note = String(formData.get("orderNote") || "").trim();
        const quantity = Math.max(1, Number(formData.get("orderQuantity") || 1));
        const deliveryType = String(formData.get("deliveryType") || "self");
        const provider = String(formData.get("orderProvider") || "").trim();
        const paymentMethod = String(formData.get("paymentMethod") || "alipay");
        if (!vehicle || !recipient || !phone || !address || !note) return;
        if (variants.length && specs.length && !currentVariant) {
          orderVariantSummary.textContent = "请选择完整且有库存的规格后再提交订单";
          orderVariantPanel?.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (isCustomProduct && !customProductNoticeAccepted) {
          showCustomProductConfirm();
          return;
        }
        customProductNoticeAccepted = false;

        const orderId = `UO-${Date.now().toString().slice(-6)}`;
        const paymentDeadline = Date.now() + PAYMENT_COUNTDOWN_MS;
        const goodsTotal = priceToNumber(currentOrderPrice) * quantity;
        const discount = calcDiscount(goodsTotal);
        const finalTotal = Math.max(0, goodsTotal - discount);
        const totalPrice = formatCurrency(finalTotal);
        const displayType = deliveryType === "provider" ? (provider ? `指定服务商：${provider}` : "待分配服务商") : "平台自提";
        let payMethodText = ({ alipay: "\u652f\u4ed8\u5b9d", wechat: "\u5fae\u4fe1\u652f\u4ed8" })[paymentMethod] || "\u652f\u4ed8\u5b9d";
        const nextOrders = [
          {
            id: orderId,
            paymentDeadline,
            type: "商品订单",
            displayType,
            user: "当前用户",
            vehicle,
            service: `${product.name || name}${currentSpecSummary ? `（${currentSpecSummary}）` : ""} x${quantity}`,
            sku: baseSku,
            variantSku: currentVariantSku,
            specSummary: currentSpecSummary,
            isCustomProduct: isCustomProduct ? "是" : "否",
            provider: deliveryType === "provider" ? (provider || "待分配") : "平台仓",
            city: "上海",
            quote: totalPrice,
            goodsPrice: formatCurrency(goodsTotal),
            couponName: selectedCoupon ? selectedCoupon.name : "",
            couponDiscount: discount,
            serviceFee: "待门店确认",
            payment: "待支付",
            paymentMethod: payMethodText,
            status: "待付款",
            progress: `订单已提交，${deliveryType === "provider" ? "待完成支付后配送至指定服务商门店" : "待完成支付后由平台发货，快递将配送至"} ${address}，备注：${note}`,
            appointment: deliveryType === "provider" ? "到货后预约" : "等待发货",
            intention: provider || "无",
            address,
            recipient,
            phone,
            deliveryType,
          },
          ...readOrders(),
        ].slice(0, 20);

        writeOrders(nextOrders);

        if (sourceFrom === "cart") {
          writeCart(readCart().filter((item) => String(item.variantSku || item.sku || "") !== String(variantSkuParam || sku)));
        }

        currentOrderId = orderId;
        currentPaymentSourceName = product.name || name;
        currentPaymentPoints = Math.floor(finalTotal / 100);
        paymentCompleted = false;
        orderPaymentAmount.textContent = totalPrice;
        orderPaymentMethod.textContent = payMethodText;
        orderPaymentPanel.hidden = true;
        orderCreateForm.hidden = true;
        orderSuccess.hidden = false;
        orderSuccessTitle.textContent = "订单已提交";
        orderSuccessText.textContent = `${product.name || name} 已提交订单，订单编号 ${orderId}。请完成支付后安排发货。`;
        orderCenterLink.textContent = "去支付";
        orderCenterLink.href = "#";
        startPaymentCountdown(paymentDeadline, orderId);
      });

      orderCenterLink.addEventListener("click", (event) => {
        if (paymentCompleted || !currentOrderId) return;
        event.preventDefault();
        orderPaymentPanel.hidden = false;
        orderPaymentPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      orderPaymentConfirm.addEventListener("click", () => {
        if (!currentOrderId || paymentCompleted || Date.now() >= currentPaymentDeadline) return;
        paymentCompleted = true;
        if (paymentCountdownTimer) window.clearInterval(paymentCountdownTimer);
        paymentCountdownTimer = null;
        updateStoredOrder(currentOrderId, {
          payment: "已支付",
          status: "待发货",
          progress: "商品已付款，等待平台发货。",
        });
        appendPointRow({
          type: "order",
          title: "商品付款获得积分",
          points: currentPaymentPoints,
          source: currentPaymentSourceName,
          sourceId: currentOrderId,
          desc: `商品订单支付成功，按每满 100 元获得 1 积分，共 ${currentPaymentPoints} 积分。`,
        });
        orderPaymentPanel.hidden = true;
        orderPaymentConfirm.disabled = true;
        orderPaymentCountdown.classList.remove("expired");
        orderPaymentCountdown.classList.add("paid");
        orderPaymentCountdown.querySelector("span").textContent = "支付已完成";
        orderPaymentCountdownValue.textContent = "已支付";
        orderSuccessTitle.textContent = "支付成功";
        orderSuccessText.textContent = `${currentPaymentSourceName} 已支付成功，获得 ${currentPaymentPoints} 积分，订单编号 ${currentOrderId}。`;
        orderCenterLink.textContent = "查看订单";
        orderCenterLink.href = `user-app.html?tab=me&meTab=orders&orderId=${encodeURIComponent(currentOrderId)}&feedback=${encodeURIComponent(`${currentPaymentSourceName} 已支付成功，获得 ${currentPaymentPoints} 积分。`)}`;
      });

      // 服务商选择页逻辑
      const providerPickerTrigger = document.getElementById("providerPickerTrigger");
      const providerSelectPage = document.getElementById("providerSelectPage");
      const providerSelectList = document.getElementById("providerSelectList");
      const providerSelectBack = document.getElementById("providerSelectBack");
      const orderProviderInput = document.getElementById("orderProvider");
      const screenContent = document.querySelector(".screen-content");

      function renderProviderCards() {
        const list = (window.MockData?.providers || []).filter((p) => p.auditStatus === "已通过" || p.status === "正常营业");
        if (!list.length) {
          providerSelectList.innerHTML = `<div style="text-align:center; color:var(--muted); padding:40px 0;">暂无可用服务商</div>`;
          return;
        }
        providerSelectList.innerHTML = list.map((p) => {
          const distance = (Math.random() * 15 + 1).toFixed(1);
          const score = p.score || (4.5 + Math.random() * 0.5).toFixed(1);
          return `<button type="button" class="provider-card" data-provider-name="${p.name}">
            <div class="provider-card-photo">🏪</div>
            <div class="provider-card-body">
              <div class="provider-card-name">${p.name}</div>
              <div class="provider-card-meta">
                <span class="provider-card-score">★ ${score}</span>
                <span>距您 ${distance} km</span>
              </div>
              <div class="provider-card-meta">${p.specialties || ""}</div>
              <div class="provider-card-meta">${p.address || ""}</div>
            </div>
          </button>`;
        }).join("");

        providerSelectList.querySelectorAll(".provider-card").forEach((card) => {
          card.addEventListener("click", () => {
            const name = card.dataset.providerName;
            orderProviderInput.value = name;
            providerPickerTrigger.textContent = name;
            providerSelectPage.style.display = "none";
            if (screenContent) screenContent.style.overflow = "";
          });
        });
      }

      providerPickerTrigger.addEventListener("click", () => {
        renderProviderCards();
        providerSelectPage.style.display = "flex";
        if (screenContent) screenContent.style.overflow = "hidden";
      });

      providerSelectBack.addEventListener("click", () => {
        providerSelectPage.style.display = "none";
        if (screenContent) screenContent.style.overflow = "";
      });
    </script>
  </body>
</html>
